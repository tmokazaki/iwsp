[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iwsp"
version = "0.1.0"
description = "Reproduction of 'Interpretable weight-space programming builds transparent transformers and brain encoding models' (arXiv:2611.18114)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
iwsp-demo = "iwsp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
